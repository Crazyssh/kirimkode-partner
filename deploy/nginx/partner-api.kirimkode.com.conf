server {
    listen 80;
    listen [::]:80;
    server_name partner-api.kirimkode.com;
    return 308 https://partner-api.kirimkode.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partner-api.kirimkode.com;

    ssl_certificate /etc/letsencrypt/live/partner-api.kirimkode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partner-api.kirimkode.com/privkey.pem;

    location ~ ^/api/(agent|internal)/v1(?:/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/health/(live|ready)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / { return 404; }
}
