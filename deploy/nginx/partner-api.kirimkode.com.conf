server {
    listen 80;
    listen [::]:80;
    server_name partner-api.kirimkode.com;
    return 308 https://partner-api.kirimkode.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partner-api.kirimkode.com;

    ssl_certificate /etc/letsencrypt/live/partner-api.kirimkode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partner-api.kirimkode.com/privkey.pem;

    # Security response headers. Set at the server level and inherited by every
    # location (none override add_header), emitted on all responses via `always`.
    # This vhost serves only JSON (agent/internal API + health), never a document,
    # so the CSP is maximally strict: nothing may be loaded, framed, or based.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location ~ ^/api/(agent|internal)/v1(?:/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/health/(live|ready)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / { return 404; }
}
