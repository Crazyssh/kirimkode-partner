server {
    listen 80;
    listen [::]:80;
    server_name partner.kirimkode.com;
    return 308 https://partner.kirimkode.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partner.kirimkode.com;

    ssl_certificate /etc/letsencrypt/live/partner.kirimkode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partner.kirimkode.com/privkey.pem;

    # Security response headers. Set at the server level and emitted on every
    # response (including proxy errors) via `always`. nginx is the sole TLS
    # terminator, so HSTS is owned here and not duplicated upstream. The Next.js
    # portal ships inline hydration scripts and styles without a nonce, so the
    # CSP keeps a conservative default-src 'self' while allowing 'unsafe-inline'
    # for script/style only; framing and plugins stay fully denied.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
