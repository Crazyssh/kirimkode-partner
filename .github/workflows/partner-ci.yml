name: Partner CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  partner-ci:
    name: Partner lint, test, build, and migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PARTNER_TEST_DATABASE_ADMIN_URL: postgresql://postgres:partner_ci@localhost:5432/postgres
      PARTNER_MIGRATION_DATABASE_URL: postgresql://postgres:partner_ci@localhost:5432/kirimkode_partner_ci
    services:
      partner-postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: partner_ci
          POSTGRES_DB: kirimkode_partner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kirimkode_partner_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Partner repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install pinned Partner dependencies
        run: npm ci
      - name: Scan Partner migration SQL
        run: npm run migration:check
      - name: Lint Partner
        run: npm run lint
      - name: Typecheck Partner
        run: npm run typecheck
      - name: Run Partner unit tests
        run: npm run test:unit
      - name: Run Partner property tests
        run: npm run test:property
      - name: Run Partner integration tests
        run: npm run test:integration
      - name: Build Partner
        run: npm run build
      - name: Apply Partner migrations from empty
        run: npm run migration:from-empty
